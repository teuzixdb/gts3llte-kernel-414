name: Build gts3llte Kernel 4.14

    on:
      push:
        branches: [ gts3llte-4.14-port ]
      workflow_dispatch:

    jobs:
      build:
        name: Build Kernel 4.14 (gts3llte SM-T825)
        runs-on: ubuntu-22.04
        timeout-minutes: 120

        steps:
          - name: Checkout patch repo
            uses: actions/checkout@v4
            with:
              path: patches
              fetch-depth: 1

          - name: Install LLVM + cross toolchain
            run: |
              wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 17 || true
              sudo apt-get install -y --no-install-recommends \
                bc bison build-essential ca-certificates flex \
                git libelf-dev libssl-dev make \
                gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
                clang llvm lld ccache
              clang --version
              aarch64-linux-gnu-gcc --version

          - name: Clone CAF msm-4.14 base
            run: |
              git clone --depth=1 \
                https://github.com/android-linux-stable/msm-4.14.git \
                kernel-src
              head -5 kernel-src/Makefile

          - name: Apply patches
            run: |
              cd kernel-src
              cp ../patches/arch/arm64/configs/gts3llte_defconfig arch/arm64/configs/
              mkdir -p arch/arm64/boot/dts/samsung
              cp -r ../patches/arch/arm64/boot/dts/samsung/. arch/arm64/boot/dts/samsung/
              cp ../patches/arch/arm64/boot/dts/Makefile arch/arm64/boot/dts/Makefile
              cp ../patches/include/linux/dma-attrs.h include/linux/ 2>/dev/null || true
              [ -f ../patches/kernel/sched/core.c ] && cp ../patches/kernel/sched/core.c
              kernel/sched/core.c && echo "Applied sched/core.c"
              if [ -d ../patches/drivers ]; then
                cp -r ../patches/drivers/. drivers/
                echo "Applied drivers patches"
              fi
              echo "All patches applied OK"

          - name: Setup ccache
            uses: actions/cache@v4
            with:
              path: ~/.ccache
              key: ccache-gts3llte-414-${{ github.sha }}
              restore-keys: ccache-gts3llte-414-

          - name: Generate .config
            working-directory: kernel-src
            run: |
              make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang
              CLANG_TRIPLE=aarch64-linux-gnu- gts3llte_defconfig 2>&1 | tee ../config.log
              grep -E "^CONFIG_(USB_DWC3|PM_DEVFREQ|PREEMPT|HZ)=" out/.config || true

          - name: Build kernel
            working-directory: kernel-src
            run: |
              make -j$(nproc) O=out ARCH=arm64 \
                CROSS_COMPILE=aarch64-linux-gnu- \
                CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
                LD=ld.lld AR=llvm-ar NM=llvm-nm \
                OBJCOPY=llvm-objcopy STRIP=llvm-strip \
                Image.gz 2>&1 | tee ../build.log
              echo "Build exit: ${PIPESTATUS[0]}"
              ls -lh out/arch/arm64/boot/Image.gz 2>/dev/null || echo "Image.gz NOT found"

          - name: Show errors
            if: always()
            run: |
              echo "=== ERRORS ==="
              grep -E "error:|fatal error:" build.log | grep -v "^Binary\|grep\|head" |
              head -60 || true
              echo "=== LAST 60 LINES ==="
              tail -60 build.log || true

          - name: Upload logs
            if: always()
            uses: actions/upload-artifact@v4
            with:
              name: build-log-${{ github.run_number }}
              path: |
                build.log
                config.log
              if-no-files-found: ignore
              retention-days: 7

          - name: Upload kernel
            if: success()
            uses: actions/upload-artifact@v4
            with:
              name: kernel-${{ github.run_number }}
              path: kernel-src/out/arch/arm64/boot/Image.gz
              if-no-files-found: ignore
              retention-days: 30
