name: Build gts3llte Kernel 4.14

on:
  push:
    branches: [ gts3llte-4.14-port ]
  workflow_dispatch:

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    name: Build Kernel 4.14 (gts3llte SM-T825)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4
        with:
          path: patches
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates flex \
            git libelf-dev libssl-dev make \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            clang-17 llvm-17 lld-17 ccache
          sudo ln -sf /usr/bin/clang-17 /usr/bin/clang
          sudo ln -sf /usr/bin/llvm-ar-17 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-17 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-17 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-17 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-17 /usr/bin/llvm-strip
          sudo ln -sf /usr/bin/ld.lld-17 /usr/bin/ld.lld

      - name: Clone CAF msm-4.14 base
        run: |
          git clone --depth=1 \
            https://github.com/android-linux-stable/msm-4.14.git \
            kernel-src
          head -5 kernel-src/Makefile

      - name: Apply patches
        run: |
          cd kernel-src
          cp ../patches/arch/arm64/configs/gts3llte_defconfig arch/arm64/configs/
          mkdir -p arch/arm64/boot/dts/samsung
          cp -r ../patches/arch/arm64/boot/dts/samsung/. arch/arm64/boot/dts/samsung/
          cp ../patches/include/linux/dma-attrs.h include/linux/ 2>/dev/null || true
          grep -q "samsung" arch/arm64/boot/dts/Makefile || \
            sed -i 's/dts-dirs += qcom/dts-dirs += qcom\ndts-dirs += samsung/' arch/arm64/boot/dts/Makefile

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-gts3llte-414-${{ github.sha }}
          restore-keys: ccache-gts3llte-414-

      - name: Generate .config
        working-directory: kernel-src
        run: |
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            gts3llte_defconfig
          grep -E "^CONFIG_(ARCH_MSM8996|MSM_KGSL|SCHED_WALT|PREEMPT|HZ)=" out/.config || true

      - name: Build kernel
        working-directory: kernel-src
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy STRIP=llvm-strip \
            Image.gz 2>&1 | tee ../build.log
          echo "Build exit: ${PIPESTATUS[0]}"

      - name: Show errors
        if: failure()
        run: |
          grep -E "error:|undefined reference|fatal error" build.log | head -80 || true
          tail -100 build.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 7

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.run_number }}
          path: kernel-src/out/arch/arm64/boot/Image.gz
          retention-days: 30
